# Adult-income configuration for the option-A notebook challenge.

data:
  path: "data/adult_train.csv"
  new_path: "data/adult_new.csv"
  target: "income_over_50k"
  sensitive_attr: "sex"          # fairness audit target; race stays available as a feature
  id_column: "id"
  drop_columns: ["id", "fnlwgt", "education"]

feature_engineering:
  enabled: true

diagnostics:
  id_column: "id"
  candidate_predictors: ["workclass", "education", "marital_status", "occupation", "relationship", "race", "sex", "native_country"]
  numeric_text_columns: ["v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09", "v10", "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18", "v19", "v20", "v21", "v22", "v23", "v24", "v25"]
  placeholder_tokens: ["?", "-", "?", "n/a", "N/A", "na", "NA", ""]
  validity_rules:
    age: {min: 17, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}
    capital_loss: {min: 0}
  canonical_categories:
    workclass:
      private: "Private"
      self-emp-not-inc: "Self-emp-not-inc"
      self-emp-inc: "Self-emp-inc"
      federal-gov: "Federal-gov"
      local-gov: "Local-gov"
      state-gov: "State-gov"
      without-pay: "Without-pay"
      never-worked: "Never-worked"
    occupation:
      adm-clerical: "Adm-clerical"
      exec-managerial: "Exec-managerial"
      handlers-cleaners: "Handlers-cleaners"
      machine-op-inspct: "Machine-op-inspct"
      other-service: "Other-service"
      prof-specialty: "Prof-specialty"
      sales: "Sales"
      tech-support: "Tech-support"
      transport-moving: "Transport-moving"
    marital_status:
      divorced: "Divorced"
      married-civ-spouse: "Married-civ-spouse"
      married-spouse-absent: "Married-spouse-absent"
      never-married: "Never-married"
      separated: "Separated"
      widowed: "Widowed"
    relationship:
      husband: "Husband"
      wife: "Wife"
      own-child: "Own-child"
      unmarried: "Unmarried"
      not-in-family: "Not-in-family"
      other-relative: "Other-relative"
    sex:
      male: "Male"
      female: "Female"
    race:
      white: "White"
      black: "Black"
      asian-pac-islander: "Asian-Pac-Islander"
      amer-indian-eskimo: "Amer-Indian-Eskimo"
      other: "Other"
    native_country:
      united-states: "United-States"
      mexico: "Mexico"
      philippines: "Philippines"
      germany: "Germany"
      canada: "Canada"
      england: "England"
      italy: "Italy"
      poland: "Poland"
      china: "China"
      india: "India"
      cuba: "Cuba"
      japan: "Japan"
      taiwan: "Taiwan"
      korea: "Korea"
      vietnam: "Vietnam"
      el-salvador: "El-Salvador"
      puerto-rico: "Puerto-Rico"
      dominican-republic: "Dominican-Republic"
      guatemala: "Guatemala"
      jamaica: "Jamaica"
      nicaragua: "Nicaragua"
      trinidad-and-tobago: "Trinidad-and-Tobago"
      peru: "Peru"
      columbia: "Columbia"
      haiti: "Haiti"
      ecuador: "Ecuador"
      outlying-us-(guam-usvi-etc.): "Outlying-US(Guam-USVI-etc.)"
      hong: "Hong"
      iran: "Iran"
      france: "France"
      portugal: "Portugal"
      greece: "Greece"
      yugoslavia: "Yugoslavia"
      scotland: "Scotland"
      ireland: "Ireland"
      thailand: "Thailand"
      cambodia: "Cambodia"
      laos: "Laos"
      honduras: "Honduras"
      hawaii: "Hawaii"
      guam: "Guam"
  redundant_columns: ["education"]

split:
test_set:
  size: 0.2
  random_state: 42

preprocessing:
  numeric_features: [age, education_num, capital_gain, capital_loss, hours_per_week, v01, v02, v03, v04, v05, v06, v07, v08, v09, v10, v11, v12, v13, v14, v15, v16, v17, v18]
  categorical_features: [workclass, marital_status, occupation, relationship, race, native_country, v19, v20, v21, v22, v23, v24, v25]
  mnar_indicator_sources: [workclass, occupation]
  random_state: 42                 # target encoding and model-based imputation
  imputation:
    numeric_strategy: median
    categorical_strategy: most_frequent
  encoder: target
  scaler: robust

feature_selection:
  enabled: false
  method: vote
  min_votes: 2
  k: 10
  random_state: 42
  search_space:
    select__min_votes: {type: int, low: 1, high: 3}

model:
  type: "xgboost"
  params:
    objective: binary:logistic
    eval_metric: logloss
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    min_child_weight: 1
    gamma: 0
    reg_alpha: 0
    reg_lambda: 1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: [accuracy, balanced_accuracy, precision, recall, f1, fbeta_2, roc_auc, average_precision]
  selection_metric: roc_auc
  n_jobs: 1

tuning:
  enabled: false
  n_trials: 20
  n_splits: 5
  random_state: 42
  n_jobs: 1
  search_spaces:
    xgboost:
      model__n_estimators: {type: int, low: 100, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
      model__max_depth: {type: int, low: 2, high: 8}
      model__min_child_weight: {type: float, low: 0.1, high: 50.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}
      model__reg_lambda: {type: float, low: 0.001, high: 100.0, log: true}
      model__reg_alpha: {type: float, low: 0.00000001, high: 10.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}

output:
  results_dir: "results/adult"
  scoreboard: "results/adult_runs.csv"
  predictions_path: "results/adult/adult_new_predictions.csv"
  model_path: "models/adult_model.joblib"
